services:
  server:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - flux-data:/app/data
      - flux-uploads:/app/uploads
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      DATABASE_PATH: /app/data/flux.db
      UPLOAD_DIR: /app/uploads
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      LIVEKIT_API_KEY: fluxdevkey
      LIVEKIT_API_SECRET: fluxdevsecret_that_is_at_least_32chars_long
      LIVEKIT_URL: "ws://76.181.222.33:7880"
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: "http://76.181.222.33:3001/api/spotify/callback"
      # ── LiveKit Cloud (optional — enables Krisp noise cancellation) ──
      # When set, these take priority over the self-hosted vars above.
      # LIVEKIT_CLOUD_API_KEY: ${LIVEKIT_CLOUD_API_KEY}
      # LIVEKIT_CLOUD_API_SECRET: ${LIVEKIT_CLOUD_API_SECRET}
      # LIVEKIT_CLOUD_URL: ${LIVEKIT_CLOUD_URL}
    depends_on:
      - livekit

  livekit:
    image: livekit/livekit-server
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50060:50000-50060/udp"
    volumes:
      - ./livekit-server/livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml

volumes:
  flux-data:
  flux-uploads:
